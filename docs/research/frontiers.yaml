# The open problems behind rubys/roundhouse#617, for people and tools that pick work.
#
# This file is the single source for each frontier's status, stands, skills, next
# action, latest facts, check availability, pins and claims. tools/research/sync
# renders the README's dashboard and each brief's Stands, Skills and Claims lines
# from it: edit here, then run the script; `sync --check` fails on drift.
# Briefs own the question, the check's commands and acceptance criteria, and the
# leads. facts.md owns dated findings; attempts.md links fact IDs instead of
# repeating their numbers.
#
# status:       open | blocked | solved
# facts:        the latest facts on this frontier, newest first
# check:        the brief's check; read it there, it is not restated here
# check_public: public | partial | unavailable
# pins:         the commits the latest result was measured or validated on
# claims:       leases taken on #617 (README.md#claiming). status is active,
#               review, done or released; a lease expires seven days after
#               `since` unless its owner renews it, which moves `expires`.
#
# Quote any value that holds ": " or " #", or that YAML could read as a
# number, date or boolean; sync rejects it otherwise.

